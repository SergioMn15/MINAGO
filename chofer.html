<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinaGo | Panel del chofer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="app driver-app">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="MinaGo, inicio">
        <img class="brand-logo" src="assets/img/logo.jpg" alt="MinaGo Monitoreo de Ruta" />
        <div class="brand-copy"><p class="eyebrow" id="choferEyebrow">Panel del chofer</p><p class="page-title" id="choferNombre">Control de ruta</p></div>
      </a>
      <a class="simple-link" href="index.html">Ver mapa</a>
    </header>

    <main class="driver-shell">
      <section class="driver-panel" aria-label="Control de ruta">
        <div class="driver-status" aria-live="polite">
          <span class="status-dot" id="driverStatusDot"></span>
          <strong id="driverStatusText">Sin iniciar</strong>
        </div>

        <div class="driver-info">
          <label for="unitCode">Unidad asignada</label>
          <input id="unitCode" type="text" value="BUS-12" disabled />
        </div>
        <div class="driver-info">
          <label for="routeSelect">Ruta activa</label>
          <select id="routeSelect"><option value="Ruta Azul">Ruta Azul</option><option value="Ruta Amarillo">Ruta Amarillo</option></select>
        </div>
        <div class="driver-info">
          <label for="directionSelect">Sentido</label>
          <select id="directionSelect"><option value="Minatitlán - Colima">Minatitlán - Colima</option><option value="Colima - Minatitlán">Colima - Minatitlán</option></select>
        </div>

        <div class="driver-actions">
          <button id="startRouteBtn" class="primary-btn" type="button">Iniciar ruta</button>
          <button id="stopRouteBtn" class="secondary-btn" type="button">Detener ruta</button>
          <button id="logoutBtn" class="secondary-btn" type="button">Cerrar sesión</button>
        </div>

        <div class="driver-metrics" aria-label="Datos de ubicación">
          <div><span>Latitud</span><strong id="driverLat">--</strong></div>
          <div><span>Longitud</span><strong id="driverLng">--</strong></div>
          <div><span>Última señal</span><strong id="driverUpdatedAt">--</strong></div>
        </div>
        <div id="driverMessage" class="driver-message" role="status" aria-live="polite">Listo para iniciar tu ruta.</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/driver.js"></script>
    <script>
      (() => {
        const authorized = sessionStorage.getItem('choferAutorizado') === 'true';
        const choferNombre = sessionStorage.getItem('choferNombre');
        const unidadActiva = sessionStorage.getItem('unidadActiva');
        if (!authorized || !choferNombre || !unidadActiva) {
          window.location.href = 'login_chofer.html';
          return;
        }
        document.getElementById('choferNombre').textContent = choferNombre;
        document.getElementById('choferEyebrow').textContent = `Unidad ${unidadActiva}`;
        document.getElementById('unitCode').value = unidadActiva;
      })();
    </script>
  </body>
</html>
