<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MinaGo | Cabina de Navegación del Chofer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" />
    <!-- MapLibre GL JS para perspectiva 3D real (pitch y bearing/heading) -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="app driver-app">

    <!-- CONTENEDOR DEL MAPA 3D (PANTALLA COMPLETA) -->
    <div id="driverMap" class="driver-map-container" aria-label="Mapa de navegación 3D"></div>

    <!-- HUD SUPERIOR: INFORMACIÓN DE RUTA Y SATÉLITE -->
    <header class="cockpit-topbar">
      <div class="cockpit-unit-pill">
        <div class="cockpit-pulse-beacon">
          <span class="status-dot" id="driverStatusDot"></span>
        </div>
        <div class="cockpit-unit-info">
          <span class="cockpit-unit-code" id="cockpitUnitCode">BUS-12</span>
          <span class="cockpit-driver-name" id="choferNombre">Conductor</span>
        </div>
      </div>

      <div class="cockpit-route-card">
        <div class="cockpit-route-main">
          <span class="route-badge-dot" id="routeBadgeColor"></span>
          <span class="route-title" id="cockpitRouteTitle">Ruta Azul</span>
          <button id="swapDirectionBtn" class="swap-direction-btn" type="button" title="Invertir sentido de ruta" aria-label="Cambiar sentido de ruta">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
          </button>
        </div>
        <div class="cockpit-direction-text" id="cockpitDirectionText">Minatitlán ➔ Colima</div>
      </div>

      <div class="cockpit-gps-status">
        <div class="gps-accuracy-chip" id="accuracyBadge" title="Precisión GPS">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="6"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
          <span id="accuracyVal">GPS listo</span>
        </div>
        <button id="drawerToggleBtn" class="cockpit-menu-btn" type="button" aria-label="Abrir panel de configuración" title="Configuración de ruta">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- WIDGET FLOTANTE: VELOCÍMETRO DIGITAL Y TIEMPO -->
    <aside class="cockpit-speedo-panel" aria-label="Velocímetro">
      <div class="speedo-dial">
        <div class="speedo-number" id="speedVal">0</div>
        <div class="speedo-unit">KM/H</div>
      </div>
      <div class="speedo-subdata">
        <div class="subdata-item">
          <span class="subdata-label">TIEMPO</span>
          <span class="subdata-val" id="tripTime">00:00</span>
        </div>
        <div class="subdata-item">
          <span class="subdata-label">ESTADO</span>
          <span class="subdata-val" id="driverStatusText">Sin iniciar</span>
        </div>
      </div>
    </aside>

    <!-- CONTROLES FLOTANTES LATERALES -->
    <div class="cockpit-floating-actions">
      <!-- Botón de centrar cámara (aparece al mover el mapa) -->
      <button id="recenterBtn" class="hud-action-btn recenter-btn hidden" type="button" title="Centrar cámara en la unidad">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span class="btn-tooltip">Centrar</span>
      </button>

      <!-- Botón de perspectiva 3D vs 2D Norte -->
      <button id="viewModeBtn" class="hud-action-btn view-mode-btn" type="button" title="Alternar entre vista 3D y 2D">
        <span class="mode-tag" id="viewModeTag">3D</span>
        <span class="btn-tooltip">Vista 3D / 2D</span>
      </button>

      <!-- Botón de Pantalla Completa -->
      <button id="fullscreenBtn" class="hud-action-btn" type="button" title="Pantalla Completa">
        <svg id="fullscreenIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <span class="btn-tooltip">Pantalla</span>
      </button>

      <!-- Botón de Simulación de Prueba -->
      <button id="simulateBtn" class="hud-action-btn sim-btn" type="button" title="Probar Simulación GPS">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
        <span class="btn-tooltip">Simular</span>
      </button>
    </div>

    <!-- HUD INFERIOR: MENSAJE Y ACCIÓN PRINCIPAL DE CONDUCCIÓN -->
    <footer class="cockpit-bottombar">
      <div class="cockpit-msg-bar" id="driverMessage" role="status" aria-live="polite">
        Listo para iniciar tu servicio. Presiona "Iniciar navegación".
      </div>

      <div class="cockpit-main-controls">
        <button id="startRouteBtn" class="cockpit-drive-btn start" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
          <span>Iniciar navegación</span>
        </button>

        <button id="stopRouteBtn" class="cockpit-drive-btn stop hidden" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
          <span>Finalizar servicio</span>
        </button>
      </div>
    </footer>

    <!-- CAJÓN LATERAL DE CONFIGURACIÓN Y TELEMETRÍA (DRAWER) -->
    <div id="drawerOverlay" class="cockpit-drawer-overlay hidden"></div>
    <aside id="driverDrawer" class="cockpit-drawer hidden" aria-label="Ajustes de conductor">
      <div class="drawer-header">
        <div class="drawer-title-wrap">
          <span class="eyebrow" id="choferEyebrow">Unidad asignada</span>
          <h2>Ajustes de Conducción</h2>
        </div>
        <button id="drawerCloseBtn" class="drawer-close-btn" type="button" aria-label="Cerrar ajustes">×</button>
      </div>

      <div class="drawer-body">
        <div class="driver-info">
          <label for="unitCode">Unidad de transporte</label>
          <input id="unitCode" type="text" value="BUS-12" disabled />
        </div>

        <div class="driver-info">
          <label for="routeSelect">Ruta asignada</label>
          <select id="routeSelect">
            <option value="Ruta Azul">Ruta Azul</option>
            <option value="Ruta Amarillo">Ruta Amarillo</option>
          </select>
        </div>

        <div class="driver-info">
          <label for="directionSelect">Sentido de circulación</label>
          <select id="directionSelect">
            <option value="Minatitlán - Colima">Minatitlán - Colima</option>
            <option value="Colima - Minatitlán">Colima - Minatitlán</option>
          </select>
        </div>

        <div class="driver-metrics" aria-label="Telemetría GPS">
          <div><span>Latitud</span><strong id="driverLat">--</strong></div>
          <div><span>Longitud</span><strong id="driverLng">--</strong></div>
          <div><span>Última señal</span><strong id="driverUpdatedAt">--</strong></div>
        </div>

        <div class="drawer-actions">
          <a class="simple-link text-center" href="index.html" target="_blank">Abrir mapa de pasajeros ↗</a>
          <button id="logoutBtn" class="logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>
    </aside>

    <!-- DEPENDENCIAS JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="assets/js/config.js"></script>
    <script type="module" src="assets/js/firebaseClient.js"></script>
    <script type="module" src="assets/js/driver.js"></script>
  </body>
</html>
