<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinaGo | Acceso de choferes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <img class="login-brand" src="assets/img/logo.jpg" alt="MinaGo Monitoreo de Ruta" />
      <header class="login-header">
        <p class="eyebrow">Área operativa</p>
        <h1>Bienvenido de nuevo</h1>
        <p>Inicia sesión para compartir la ubicación de tu unidad.</p>
      </header>

      <div id="loginMessage" class="message" role="status" aria-live="polite"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Ej. juan" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" placeholder="Tu contraseña" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn" id="submitBtn">Iniciar sesión</button>
      </form>

      <div class="demo-hint"><strong>Acceso de práctica</strong><br />juan / password123 · maria / password456 · carlos / password789</div>
      <p class="back-link"><a href="index.html">← Volver al mapa público</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script>
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const message = document.getElementById('loginMessage');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const contraseña = document.getElementById('contraseña').value;
        if (!usuario || !contraseña) return showMessage('Por favor completa todos los campos.', 'error');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Validando…';
        try {
          const { data: loginData, error } = await window.viaminaSupabase.rpc('authenticate_driver', {
            p_usuario: usuario,
            p_contrasena: contraseña
          });
          const chofer = Array.isArray(loginData) ? loginData[0] : loginData;
          if (error || !chofer?.session_token) {
            showMessage('Usuario o contraseña incorrectos.', 'error');
            return;
          }
          sessionStorage.setItem('choferAutorizado', 'true');
          sessionStorage.setItem('choferNombre', chofer.nombre_completo);
          sessionStorage.setItem('choferId', chofer.chofer_id);
          sessionStorage.setItem('unidadActiva', chofer.codigo_unidad);
          sessionStorage.setItem('choferSessionToken', chofer.session_token);
          showMessage('Inicio de sesión exitoso. Redirigiendo…', 'success');
          setTimeout(() => { window.location.href = 'chofer.html'; }, 700);
        } catch (error) {
          console.error('Error de inicio de sesión:', error);
          showMessage('No pudimos conectar con el servidor.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Iniciar sesión';
        }
      });

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
      }
    </script>
  </body>
</html>
