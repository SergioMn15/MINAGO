<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinaGo | Acceso de choferes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <img class="login-brand" src="assets/img/logo.jpg" alt="MinaGo Monitoreo de Ruta" />
      <header class="login-header">
        <p class="eyebrow">Área operativa</p>
        <h1>Bienvenido de nuevo</h1>
        <p>Inicia sesión para compartir la ubicación de tu unidad.</p>
      </header>

      <div id="loginMessage" class="message" role="status" aria-live="polite"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Correo electrónico</label>
          <input type="email" id="usuario" placeholder="chofer@minago.mx" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" placeholder="Tu contraseña" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn" id="submitBtn">Iniciar sesión</button>
      </form>

      <p class="back-link"><a href="index.html">← Volver al mapa público</a></p>
    </main>

    <script src="assets/js/config.js"></script>
    <script type="module">
      import { app } from './assets/js/firebaseClient.js';
      import { get } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';
      import { ref } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';
      import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

      const auth = getAuth(app);
      const database = window.viaminaDatabase;
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const message = document.getElementById('loginMessage');

      async function getAssignedUnit(user) {
        const snapshot = await get(ref(database, `choferes/${user.uid}/unidad_asignada`));
        const unitCode = snapshot.val();
        if (typeof unitCode !== 'string' || !unitCode.trim()) {
          throw new Error('NO_UNIT_ASSIGNED');
        }
        return unitCode.trim();
      }

      async function redirectAuthenticatedUser(user) {
        const unitCode = await getAssignedUnit(user);
        sessionStorage.setItem('choferNombre', user.displayName || user.email || 'Chofer');
        sessionStorage.setItem('choferId', user.uid);
        sessionStorage.setItem('unidadActiva', unitCode);
        showMessage('Inicio de sesión exitoso. Redirigiendo…', 'success');
        window.location.href = 'chofer.html';
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) return;
        try {
          await redirectAuthenticatedUser(user);
        } catch (error) {
          await signOut(auth);
          showMessage(error.message === 'NO_UNIT_ASSIGNED'
            ? 'Tu cuenta no tiene una unidad asignada. Contacta al administrador.'
            : 'No se pudo validar tu unidad. Intenta nuevamente.', 'error');
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('usuario').value.trim();
        const contraseña = document.getElementById('contraseña').value;
        if (!email || !contraseña) return showMessage('Por favor completa todos los campos.', 'error');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Validando…';
        try {
          const credentials = await signInWithEmailAndPassword(auth, email, contraseña);
          await redirectAuthenticatedUser(credentials.user);
        } catch (error) {
          console.error('Error de inicio de sesión:', error);
          if (error.message === 'NO_UNIT_ASSIGNED') {
            await signOut(auth);
          }
          const messages = {
            'auth/invalid-credential': 'El correo o la contraseña son incorrectos.',
            'auth/user-not-found': 'No existe una cuenta con ese correo.',
            'auth/wrong-password': 'El correo o la contraseña son incorrectos.',
            'auth/invalid-email': 'Escribe un correo electrónico válido.',
            'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'
          };
          showMessage(messages[error.code] || (error.message === 'NO_UNIT_ASSIGNED'
            ? 'Tu cuenta no tiene una unidad asignada. Contacta al administrador.'
            : 'No pudimos validar tu acceso. Intenta nuevamente.'), 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Iniciar sesión';
        }
      });

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
      }
    </script>
  </body>
</html>
