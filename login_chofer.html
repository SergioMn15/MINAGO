<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Chofer | VíaMinatitlán</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      .login-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .login-header h1 {
        font-size: 28px;
        color: #333;
        margin: 0 0 8px 0;
      }

      .login-header p {
        color: #666;
        font-size: 14px;
        margin: 0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-group input::placeholder {
        color: #999;
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-bottom: 16px;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        text-align: center;
        display: none;
      }

      .message.error {
        background: #fee;
        color: #c33;
        border: 1px solid #f99;
        display: block;
      }

      .message.success {
        background: #efe;
        color: #3c3;
        border: 1px solid #9f9;
        display: block;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      .demo-hint {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 12px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>🚌 VíaMinatitlán</h1>
        <p>Panel de Choferes</p>
      </div>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Nombre de usuario</label>
          <input 
            type="text" 
            id="usuario" 
            placeholder="ej: juan" 
            autocomplete="username"
            required 
          />
        </div>

        <div class="form-group">
          <label for="contraseña">Contraseña</label>
          <input 
            type="password" 
            id="contraseña" 
            placeholder="Tu contraseña segura" 
            autocomplete="current-password"
            required 
          />
        </div>

        <button type="submit" class="login-btn" id="submitBtn">Iniciar Sesión</button>
      </form>

      <div class="demo-hint">
          <strong>Demo:</strong> Usuario: juan | Contraseña: password123<br>
          También: maria/password456, carlos/password789

      <div class="back-link">
        <a href="index.html">← Volver al mapa público</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script>
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const message = document.getElementById('loginMessage');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const usuario = document.getElementById('usuario').value.trim();
        const contraseña = document.getElementById('contraseña').value;

        if (!usuario || !contraseña) {
          showMessage('Por favor completa todos los campos', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Validando...';

        try {
          // Consultar chofer en Supabase
          const { data: choferes, error } = await window.viaminaSupabase
            .from('choferes')
            .select('id, usuario, nombre, apellido, contraseña_hash, activo')
            .eq('usuario', usuario)
            .eq('activo', true)
            .maybeSingle();

          if (error) {
            console.error('Error al consultar chofer:', error);
            showMessage('Error al conectar con el servidor', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar Sesión';
            return;
          }

          if (!choferes) {
            showMessage('Usuario o contraseña incorrectos', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar Sesión';
            return;
          }

          // Validar contraseña (nota: en este MVP comparamos directamente)
          // EN PRODUCCIÓN: usa bcrypt.compare() en el backend
          if (choferes.contraseña_hash !== contraseña) {
            showMessage('Usuario o contraseña incorrectos', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar Sesión';
            return;
          }

          // Obtener unidades asignadas al chofer
          const { data: asignaciones, error: errorAsig } = await window.viaminaSupabase
            .from('chofer_unidad_asignacion')
            .select('codigo_unidad')
            .eq('chofer_id', choferes.id);

          if (errorAsig || !asignaciones || asignaciones.length === 0) {
            showMessage('No tienes unidades asignadas', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar Sesión';
            return;
          }

          // Guardar en sessionStorage
          sessionStorage.setItem('choferAutorizado', 'true');
          sessionStorage.setItem('choferNombre', `${choferes.nombre} ${choferes.apellido}`);
          sessionStorage.setItem('choferId', choferes.id);
          sessionStorage.setItem('unidadActiva', asignaciones[0].codigo_unidad);

          showMessage('Inicio de sesión exitoso. Redirigiendo...', 'success');

          setTimeout(() => {
            window.location.href = 'chofer.html';
          }, 1000);
        } catch (err) {
          console.error('Error:', err);
          showMessage('Ocurrió un error inesperado', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Iniciar Sesión';
        }
      });

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
        setTimeout(() => {
          if (type === 'error') {
            message.className = 'message';
          }
        }, 5000);
      }
    </script>
  </body>
</html>
